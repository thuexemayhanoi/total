name: Factory Engine Quality

# Engine/template/workflow changes get the heavy gate.
# Article content pushes do NOT trigger this workflow; Factory Publish Lite owns
# scoped content QA so the hot loop has only one content pipeline.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'factory/factory.js'
      - 'factory/generate.js'
      - 'factory/qa.js'
      - 'factory/seo.js'
      - 'factory/site.config.js'
      - 'factory/link-integrity.js'
      - 'factory/lib/**'
      - 'factory/data/categories.js'
      - 'factory/test*.js'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: factory-engine-quality
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Heavy engine gate
        run: |
          set -euo pipefail
          node factory/test.js
          node factory/test-hardening.js
          node factory/test-reliability.js
          node factory/test-pair.js
          node factory/test-cycle.js
          node factory/test-coordinator.js
          node factory/factory.js verify-invariant
          node factory/generate.js --check
          echo 'ENGINE_GATE_OK'
