name: Article Quality

# Cổng chất lượng nội dung — deterministic, không AI.
# THAY ĐỔI HARDENING:
#   - KHÔNG chạy `generate` trước `--check` nữa: --check giờ là read-only
#     byte-exact, so sánh trực tiếp với output đã commit — chạy generate trước
#     sẽ xoá sạch bằng chứng stale/patch tay.
#   - Thêm test-hardening.js (regression cho --check, publish atomic, breadcrumb).
#   - Concurrency theo ref để PR không cancel run của main (và ngược lại).
on:
  push:
    branches: [main]
    paths: ['factory/**', 'assets/css/**', 'assets/js/**', '.github/workflows/article-quality.yml']
  pull_request:
    branches: [main]
    paths: ['factory/**', 'assets/css/**', 'assets/js/**', '.github/workflows/article-quality.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: article-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Check + Audit + Test
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Không AI API bên trong GitHub Actions — chỉ kiểm tra tĩnh.

      - name: Kiểm tra không patch tay HTML (read-only, byte-exact)
        run: node factory/generate.js --check

      - name: Audit chất lượng bài viết
        run: node factory/factory.js audit --min-score 90

      - name: Bộ kiểm thử nền tảng
        run: node factory/test.js

      - name: Bộ kiểm thử hardening (regression --check/publish/breadcrumb)
        run: node factory/test-hardening.js

      # BỘ RELIABILITY 4 TẦNG (Unit -> Integration -> Production invariant ->
      # Long-run/Failure recovery): lock ownership-safe, continuous drain,
      # NO-PROGRESS sentinel, soak/recovery — mọi kịch bản trên fixture tmp.
      - name: Bộ kiểm thử reliability 4 tầng (lock/drain/invariant/recovery)
        run: node factory/test-reliability.js
