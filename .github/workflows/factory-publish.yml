name: Factory Publish (pair)

# Pipeline publish tự động, deterministic — KHÔNG AI, KHÔNG API key, KHÔNG secret.
# SIMPLE PRODUCTION MODE (port /vanchinh, đơn giản hóa cho 6.000–20.000+ bài):
#   writer ngoài viết ĐÚNG 2 bài/lần (PAIR_SIZE = 2) rồi push main
#   -> publisher xác định EXACT article IDs của commit (push-scope)
#   -> publish-plan (resume backlog cũ TRƯỚC, scope pair SAU)
#   -> mỗi txn: publish-pair <ids> (lock -> scoped QA >= 75 + SEO >= 70 ->
#      generate -> verify-pair nhẹ -> lật đúng rows PUBLISHED -> COMMIT txn)
#   -> commit "factory: publish pair <ids>" + push
#   -> cổng cuối: state sạch + backlog claimable = 0 + generate --check.
#
#   KHÔNG sweep slot khác, KHÔNG tự claim <= 10 bài khác (exact push scope),
#   KHÔNG audit/test toàn site mỗi pair — heavy gate chỉ chạy ở:
#   (a) mốc 100 PUBLISHED, (b) workflow factory-deep-audit.yml, (c) engine CI.
#   drain-iteration/publish legacy vẫn còn trong factory.js (manual recovery).
#
#   NO-PROGRESS/RECOVERY: repo là checkpoint resumable — txn marker sót ->
#   recover-txn; fail giữa chừng KHÔNG ghi state dở, chạy lại sẽ resume.

on:
  push:
    branches: [main]
    paths: ['factory/data/articles/**', '.github/workflows/factory-publish.yml']
  workflow_dispatch:
    inputs:
      pair:
        description: 'ID pair cần publish (vd S00055,S00056) — bỏ trống để resume backlog'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: factory-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Không AI/API bên trong Actions — mọi bước đều deterministic.

      - name: Đọc trạng thái xưởng (READ STATE -> RECOVER/RESUME)
        run: |
          node factory/factory.js status
          node factory/factory.js resume

      # RECOVER txn marker sót (crash giữa transaction của run trước) —
      # idempotent: ids đã PUBLISHED -> completed, ngược lại -> rolled-back.
      - name: Recover txn nếu sót (fail-closed khi check-state đỏ vì txn)
        run: |
          if ! node factory/factory.js check-state; then
            echo "state không sạch — thử recover txn marker…"
            node factory/factory.js recover-txn
            node factory/factory.js check-state
          fi

      - name: 'EXACT PUSH SCOPE: article IDs được ADD/MODIFY bởi commit này'
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.pair }}" ]; then
            # Manual dispatch: ID tường minh, đúng pair contract.
            SCOPE_MODE="pair"; SCOPE_IDS="${{ github.event.inputs.pair }}"
            echo "scope từ workflow_dispatch input"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            OUT=$(node factory/factory.js push-scope)
            echo "$OUT"
            SCOPE_MODE=$(printf '%s\n' "$OUT" | sed -n 's/^SCOPE_MODE=//p')
            SCOPE_IDS=$(printf '%s\n' "$OUT" | sed -n 's/^SCOPE_IDS=//p')
          else
            SCOPE_MODE="empty"; SCOPE_IDS=""
          fi
          echo "scope mode=$SCOPE_MODE ids=$SCOPE_IDS"
          echo "mode=$SCOPE_MODE" >> "$GITHUB_OUTPUT"
          echo "ids=$SCOPE_IDS" >> "$GITHUB_OUTPUT"

      - name: Gate (chỉ chạy khi pair/repair trong scope hoặc còn backlog claimable)
        id: gate
        run: |
          set -euo pipefail
          BACKLOG=$(node factory/factory.js backlog | sed -n 's/^CLAIMABLE_BACKLOG=//p')
          echo "backlog claimable: $BACKLOG"
          SCOPE_IDS="${{ steps.scope.outputs.ids }}"
          if [ -n "$SCOPE_IDS" ] || [ "$BACKLOG" -gt 0 ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "không có article trong push và không còn backlog claimable -> bỏ qua pipeline publish"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Guard: state sạch (không lock bị commit, ma trận hợp lệ, checkpoint khớp)'
        if: steps.gate.outputs.proceed == 'true'
        run: node factory/factory.js check-state

      # PLAN: resume backlog article-backed CŨ trước (crash recovery, không
      # trộn), rồi scope của push này; mỗi txn đúng PAIR_SIZE = 2 ID.
      - name: Kế hoạch txn (publish-plan — resume trước, exact scope sau)
        id: plan
        if: steps.gate.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          if [ -n "${{ steps.scope.outputs.ids }}" ]; then
            node factory/factory.js publish-plan --scope "${{ steps.scope.outputs.ids }}" | tee /tmp/plan.txt
          else
            node factory/factory.js publish-plan | tee /tmp/plan.txt
          fi

      # EXACT-PUSH-SCOPE PUBLISH: mỗi dòng TXN = đúng 1 pair transaction.
      # publish-pair là atomic: QA/SEO scoped đủ điều kiện MỚI ghi state; fail
      # giữ nguyên state để retry/resume. Sau mỗi pair: commit + push (retry
      # rebase an toàn).
      - name: Publish từng pair (publish-pair — atomic, đúng 1-2 ID/txn)
        id: pairs
        if: steps.gate.outputs.proceed == 'true'
        env:
          TOKEN_FILE: ${{ runner.temp }}/writer-lock-token
        run: |
          set -euo pipefail
          git config user.name "total-factory-bot"
          git config user.email "nguyentuantu2482@users.noreply.github.com"
          grep '^TXN ' /tmp/plan.txt | while read -r _ idx ids mode; do
            echo "=== PAIR TXN $idx: $ids (mode=$mode) ==="
            node factory/factory.js publish-pair "$ids" --owner ci-publisher --token-file "$TOKEN_FILE"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "factory: publish pair $ids [automated txn]"
              ok=0
              for t in 1 2 3; do
                if git pull --rebase origin main && git push; then ok=1; break; fi
                echo "push vướng (lần $t) — rebase an toàn rồi thử lại"
                sleep 5
              done
              if [ "$ok" != "1" ]; then
                echo "push thất bại sau 3 lần — repo vẫn là checkpoint, chạy lại sẽ resume đúng pair"
                exit 1
              fi
            else
              echo "pair $ids không thay đổi gì trên đĩa (đã publish?) — không cần commit"
            fi
          done
          echo "toàn bộ txn pair hoàn tất"

      # Cleanup CHỈ giải phóng lock khi CHÍNH run này còn giữ token (publish-pair
      # tự thả lock sau mỗi pair — bước này là lưới an toàn cho run bị kill).
      - name: Giải phóng writer lock nếu còn sót (chỉ khi run này giữ token)
        if: always() && steps.gate.outputs.proceed == 'true'
        env:
          TOKEN_FILE: ${{ runner.temp }}/writer-lock-token
        run: |
          if [ -f "$TOKEN_FILE" ]; then
            node factory/factory.js unlock --owner ci-publisher --token "$(cat "$TOKEN_FILE")"
            rm -f "$TOKEN_FILE"
          else
            echo "run này không còn giữ writer lock — KHÔNG đụng lock của writer khác."
          fi

      # CỔNG CUỐI NHẸ — SUCCESS chỉ khi: state sạch + backlog claimable = 0 +
      # cây sinh khớp generator. Heavy suite (audit/hardening/reliability)
      # KHÔNG chạy mỗi pair — chỉ ở mốc 100 bài và deep audit.
      - name: 'Cổng cuối: state sạch + backlog claimable = 0'
        if: steps.gate.outputs.proceed == 'true'
        run: |
          node factory/factory.js check-state
          node factory/factory.js backlog --fail-if-claimable --head-sha "$GITHUB_SHA"

      - name: 'Cổng cuối: không patch tay HTML (read-only, byte-exact)'
        if: steps.gate.outputs.proceed == 'true'
        run: node factory/generate.js --check

      # MỐC 100 BÀI: milestone heavy gate (audit toàn factory + invariant +
      # toàn bộ test suite) — không chặn writer sau mỗi pair, chỉ theo mốc.
      - name: 'Mốc 100 PUBLISHED: heavy gate (audit + invariant + test suite)'
        if: steps.gate.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          PUBLISHED=$(node -e "const m=require('./factory/state/matrix.json');console.log(m.slots.filter(s=>s.state==='PUBLISHED').length)")
          echo "PUBLISHED=$PUBLISHED"
          if [ $((PUBLISHED % 100)) -eq 0 ]; then
            echo "milestone $PUBLISHED bài — chạy heavy gate"
            node factory/factory.js audit --min-score 75
            node factory/factory.js verify-invariant
            node factory/test.js
            node factory/test-hardening.js
            node factory/test-reliability.js
            node factory/test-pair.js
          else
            echo "chưa chạm mốc 100 bài — bỏ qua heavy gate (deep audit vẫn chạy được manual)"
          fi
