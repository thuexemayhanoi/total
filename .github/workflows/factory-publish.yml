name: Factory Publish Lite (batch 1-10)

# HOT PATH giống Motoopen Article Factory Lite nhưng giữ chuẩn bài dài /total:
# exact push scope -> fresh main -> scoped QA -> publish 1-10 bài MỘT transaction
# -> scoped internal-link 404 gate -> commit một lần.
# Full-site audit/generate byte-exact/invariant nặng được tách sang workflow manual.
on:
  push:
    branches: [main]
    paths:
      - 'factory/data/articles/**'
      - '.github/workflows/factory-publish.yml'

permissions:
  contents: write

concurrency:
  group: total-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capture exact push scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then base="HEAD~1"; fi
          out=$(node factory/factory.js push-scope --base "$base")
          echo "$out"
          ids=$(printf '%s\n' "$out" | sed -n 's/^SCOPE_IDS=//p')
          if [ -z "$ids" ]; then count=0; proceed=false; else count=$(awk -F',' '{print NF}' <<< "$ids"); proceed=true; fi
          if [ "$count" -gt 10 ]; then echo "QUEUE_REFUSE: tối đa 10 article IDs mỗi batch"; exit 1; fi
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

      - name: Refresh fresh main
        if: steps.scope.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - name: Recover + state guard
        if: steps.scope.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          node factory/factory.js recover-txn
          node factory/factory.js check-state

      # Producer pushes can race and GitHub may coalesce pending Action runs.
      # Always QA the shared, committed backlog on fresh main; never assume the
      # triggering push is the only Writer work currently waiting.
      - name: Scoped preflight QA (1-10)
        id: selected
        if: steps.scope.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! queue=$(node factory/factory.js writer-queue-ready --count 10 2>&1); then
            echo "$queue"; exit 1
          fi
          echo "$queue"
          ids=$(printf '%s\n' "$queue" | sed -n 's/^READY_IDS=//p' | tail -1)
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          if [ -n "$ids" ]; then node factory/factory.js verify-batch "$ids"; fi

      - name: Publish whole batch once
        if: steps.selected.outputs.ids != ''
        run: |
          set -euo pipefail
          node factory/factory.js publish-batch "${{ steps.selected.outputs.ids }}" --owner ci-publisher

      - name: 404 gate defense-in-depth
        if: steps.selected.outputs.ids != ''
        run: |
          set -euo pipefail
          node factory/link-integrity.js --ids "${{ steps.selected.outputs.ids }}"
          node factory/factory.js check-state

      # Coordinator-owned and fail-closed: the current batch is already
      # PUBLISHED in the working tree, but NOTHING is pushed until this passes.
      # Normal path updates only 1-10 article modules; incomplete old manifest
      # gets one guarded bootstrap. SQLite is gitignored (derived cache).
      - name: Refresh complete article manifest and SQLite
        if: steps.selected.outputs.ids != ''
        run: |
          set -euo pipefail
          node factory/factory.js index-refresh "${{ steps.selected.outputs.ids }}" --role coordinator
          node factory/factory.js index-check

      # Up to W1+W2+W3 x 10 articles per production run, while retaining
      # one publisher, one shared lock and one final commit. Never start AI.
      - name: Drain other Writer backlog safely (max 20 more)
        if: steps.scope.outputs.proceed == 'true'
        shell: bash
        env:
          FIRST_IDS: ${{ steps.selected.outputs.ids }}
        run: |
          set -euo pipefail
          seen="$FIRST_IDS"
          for round in 2 3; do
            if ! queue=$(node factory/factory.js writer-queue-ready --count 10 --exclude "$seen" 2>&1); then
              echo "$queue"; exit 1
            fi
            echo "$queue"
            ids=$(printf '%s\n' "$queue" | sed -n 's/^READY_IDS=//p' | tail -1)
            if [ -z "$ids" ]; then echo "DRAIN_DONE round=$round"; break; fi
            if [ -n "$seen" ]; then seen="$seen,$ids"; else seen="$ids"; fi
            node factory/factory.js verify-batch "$ids"
            node factory/factory.js publish-batch "$ids" --owner ci-publisher
            node factory/link-integrity.js --ids "$ids"
            node factory/factory.js check-state
            node factory/factory.js index-refresh "$ids" --role coordinator
            node factory/factory.js index-check
            echo "DRAIN_BATCH_OK round=$round ids=$ids"
          done

      - name: Commit batch outputs + state once
        if: steps.scope.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          git config user.name "total-factory-bot"
          git config user.email "nguyentuantu2482@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "BATCH_NO_CHANGES"
            exit 0
          fi
          git commit -m "factory: publish lite batch ${{ steps.scope.outputs.ids }} [automated]"
          ok=0
          for i in 1 2 3; do
            if git push; then ok=1; break; fi
            git fetch origin main
            # Reject overlap, especially generated HTML/sitemap/manifest: never
            # silently rebase unrelated writer edits into already-QAed output.
            overlap=$(comm -12 <(git diff --name-only HEAD^ HEAD | sort) <(git diff --name-only HEAD^ origin/main | sort))
            if [ -n "$overlap" ]; then echo "PUBLISH_REBASE_OVERLAP_REFUSED $overlap"; break; fi
            if ! git rebase origin/main; then git rebase --abort 2>/dev/null || true; break; fi
          done
          if [ "$ok" != "1" ]; then echo "BATCH_PUSH_FAIL"; exit 1; fi

      - name: Empty scope
        if: steps.scope.outputs.proceed != 'true'
        run: echo "SCOPE_EMPTY"
