name: Factory Publish Lite (batch 1-10)

# HOT PATH giống Motoopen Article Factory Lite nhưng giữ chuẩn bài dài /total:
# exact push scope or 30-min backlog recovery -> fresh main -> scoped QA -> publish 1-10 bài MỘT transaction
# -> scoped internal-link 404 gate -> commit một lần.
# Full-site audit/generate byte-exact/invariant nặng được tách sang workflow manual.
on:
  push:
    branches: [main]
    paths:
      - 'factory/data/articles/**'
      - '.github/workflows/factory-publish.yml'
  # /blog pattern: lost/cancelled push runs are recovered from latest article-backed backlog.
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: total-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capture exact article scope from a writer push
        id: pushscope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then base="HEAD~1"; fi
            out=$(node factory/factory.js push-scope --base "$base")
            echo "$out"
            ids=$(printf '%s\n' "$out" | sed -n 's/^SCOPE_IDS=//p')
            if [ -n "$ids" ] && [ "$(awk -F',' '{print NF}' <<< "$ids")" -gt 10 ]; then
              echo "QUEUE_REFUSE: max 10 article IDs in one writer push" >&2
              exit 1
            fi
          else
            ids=""
          fi
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

      - name: Refresh fresh main before selecting backlog
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - name: Choose push scope or recover article-backed backlog (max 10)
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          ids="${{ steps.pushscope.outputs.ids }}"
          if [ -z "$ids" ]; then
            # Unlike push-scope, this finds drafts left by a cancelled/missed run.
            # Only files that already exist are eligible. No AI prose is generated.
            plan=$(node factory/factory.js plan-chunk --limit 10)
            echo "$plan"
            ids=$(printf '%s\n' "$plan" | sed -n 's/^PLAN ids=//p' | tr ' ' '\n' | sed -n 's/^\(S[0-9][0-9]*\):.*$/\1/p' | paste -sd, -)
          fi
          if [ -z "$ids" ]; then count=0; proceed=false; else count=$(awk -F',' '{print NF}' <<< "$ids"); proceed=true; fi
          if [ "$count" -gt 10 ]; then echo "QUEUE_REFUSE: too many IDs" >&2; exit 1; fi
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
          echo "Recovery queue has $count article(s); proceed=$proceed"

      - name: Recover + state guard
        if: steps.scope.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          node factory/factory.js recover-txn
          node factory/factory.js check-state

      - name: Scoped preflight QA (1-10)
        if: steps.scope.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          node factory/factory.js verify-batch "${{ steps.scope.outputs.ids }}"

      - name: Publish whole batch once
        if: steps.scope.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          node factory/factory.js publish-batch "${{ steps.scope.outputs.ids }}" --owner ci-publisher

      - name: 404 gate defense-in-depth
        if: steps.scope.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          node factory/link-integrity.js --ids "${{ steps.scope.outputs.ids }}"
          node factory/factory.js check-state

      # Coordinator-owned and fail-closed: the current batch is already
      # PUBLISHED in the working tree, but NOTHING is pushed until this passes.
      # Normal path updates only 1-10 article modules; incomplete old manifest
      # gets one guarded bootstrap. SQLite is gitignored (derived cache).
      - name: Refresh complete article manifest and SQLite
        if: steps.scope.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          node factory/factory.js index-refresh "${{ steps.scope.outputs.ids }}" --role coordinator
          node factory/factory.js index-check

      - name: Commit batch outputs + state once
        if: steps.scope.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          git config user.name "total-factory-bot"
          git config user.email "nguyentuantu2482@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "BATCH_NO_CHANGES"
            exit 0
          fi
          git commit -m "factory: publish lite batch ${{ steps.scope.outputs.ids }} [automated]"
          ok=0
          for i in 1 2 3; do
            if git push; then ok=1; break; fi
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort 2>/dev/null || true; break; fi
          done
          if [ "$ok" != "1" ]; then echo "BATCH_PUSH_FAIL"; exit 1; fi

      - name: Empty scope
        if: steps.scope.outputs.proceed != 'true'
        run: echo "SCOPE_EMPTY"
