name: Factory Publish (chunked)

# Pipeline publish tự động, deterministic — KHÔNG AI, KHÔNG API key, KHÔNG secret.
# Kiến trúc vận hành port từ /vanchinh, adapt sang Node factory của /total:
#   writer ngoài (agent/Mistral run) commit bài viết dưới factory/data/articles/
#   -> pipeline chạy đúng công cụ của xưởng (factory.js, generate.js, test.js).
#
# THAY ĐỔI HARDENING 4-TẦNG (docs/FACTORY-RELIABILITY.md):
#   - DEFECT A: writer lock ownership-safe. Acquire dùng primitive exclusive
#     thật + token unique từng acquisition; cleanup của workflow CHỈ giải phóng
#     lock khi token file tồn tại (chính run này đã acquire) — acquire fail
#     thì KHÔNG BAO GIỜ xóa lock của writer khác. TTL 30 phút không phải daemon:
#     stale chỉ được reclaim theo contract trong lock.acquire (race-safe).
#   - DEFECT B: CONTINUOUS BACKLOG DRAIN — commit bằng GITHUB_TOKEN không tự
#     trigger workflow push tiếp theo, nên một production run phải DRAIN TOÀN
#     BỘ backlog article-backed claimable: mỗi vòng `drain-iteration` xử lý
#     đúng một chunk <= 10 ID (QA >= 75 -> publish explicit IDs, atomic),
#     commit chunk, rồi lặp tới khi backlog = 0. KHÔNG sweep toàn bộ PASS.
#   - NO-PROGRESS SENTINEL: backlog > 0 mà một vòng không tiến triển hợp lệ
#     (published tăng / backlog giảm / slot BLOCKED vì QA thật) -> FAIL LOUD.
#   - Giới hạn vòng an toàn tính từ workload thực tế qua `drain-bound`
#     (ceil(initial/limit) + phụ cấp recovery) — không hardcode "1000 vòng".
#   - SUCCESS chỉ khi cuối run: state sạch + backlog claimable = 0
#     (--fail-if-claimable) + generate --check + audit >= 75 + test.js +
#     test-hardening.js. PLANNED chưa có module bài = WAITING_FOR_WRITER,
#     KHÔNG phải lỗi CI.
#   - Logic backlog/chunk/invariant nằm trong factory/lib/factory-runtime.js
#     (deterministic, test được 4 tầng) — YAML chỉ orchestration.
#   - Mọi cổng fail loud, không có step nào được phép "lỗi mà vẫn xanh" —
#     repo là checkpoint resumable nên fail là an toàn.

on:
  push:
    branches: [main]
    paths: ['factory/data/articles/**', '.github/workflows/factory-publish.yml']

permissions:
  contents: write

concurrency:
  group: factory-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Không AI/API bên trong Actions — mọi bước đều deterministic.

      - name: Đọc trạng thái xưởng (READ STATE -> RECOVER/RESUME)
        run: |
          node factory/factory.js status
          node factory/factory.js resume

      - name: Gate (chỉ chạy khi push thêm bài mới hoặc còn backlog claimable)
        id: gate
        run: |
          # Chỉ bài MỚI THÊM khởi động chunk sản xuất; bài sửa (repair, rebuild)
          # không tự claim chunk mới. Backlog tính bằng factory.js backlog
          # (logic canonical — KHÔNG heredoc duplicate).
          NEW_ARTICLES=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- factory/data/articles/ | wc -l | tr -d ' ')
          echo "bài mới trong push này: $NEW_ARTICLES"
          BACKLOG=$(node factory/factory.js backlog | sed -n 's/^CLAIMABLE_BACKLOG=//p')
          echo "backlog claimable (slot chưa xong đã có bài): $BACKLOG"
          if [ "$NEW_ARTICLES" -gt 0 ] || [ "$BACKLOG" -gt 0 ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "không có bài mới và không còn backlog claimable -> bỏ qua pipeline publish"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Guard: state sạch (không lock bị commit, ma trận hợp lệ, checkpoint khớp)'
        if: steps.gate.outputs.proceed == 'true'
        run: node factory/factory.js check-state

      - name: Giới hạn vòng an toàn (tính từ workload thực tế — không hardcode)
        id: bound
        if: steps.gate.outputs.proceed == 'true'
        run: |
          CLAIMABLE=$(node factory/factory.js backlog | sed -n 's/^CLAIMABLE_BACKLOG=//p')
          MAX=$(node factory/factory.js drain-bound "$CLAIMABLE" | sed -n 's/^MAX_ITERATIONS=//p')
          echo "max=$MAX" >> "$GITHUB_OUTPUT"
          echo "backlog ban đầu: $CLAIMABLE -> tối đa $MAX vòng drain (ceil($CLAIMABLE/10) + phụ cấp recovery)"

      # CONTINUOUS BACKLOG DRAIN: mỗi vòng = acquire lock (token ghi ra file)
      # -> chunk <= 10 ID (resume trước, claim sau) -> QA >= 75 -> publish
      # explicit IDs (atomic: cổng generate + test xanh mới ghi state) -> thả
      # lock CỦA run này -> NO-PROGRESS sentinel. Vòng fail -> exit 1 (state
      # trước chunk vẫn resumable). KHÔNG dựa vào self-trigger của bot commit.
      - name: Drain liên tục (mỗi vòng <= 10 ID — tới khi backlog = 0)
        id: drain
        if: steps.gate.outputs.proceed == 'true'
        env:
          # Context `runner` chỉ hợp lệ ở step-level (KHÔNG dùng env cấp job).
          TOKEN_FILE: ${{ runner.temp }}/writer-lock-token
        run: |
          set -e
          MAX="${{ steps.bound.outputs.max }}"
          i=0
          while :; do
            i=$((i+1))
            echo "=== VÒNG DRAIN $i / tối đa $MAX ==="
            set +e
            OUT=$(node factory/factory.js drain-iteration --owner ci-publisher --token-file "$TOKEN_FILE" 2>&1)
            ST=$?
            set -e
            echo "$OUT"
            if [ "$ST" != "0" ]; then
              echo "drain iteration fail (exit $ST) — state trước chunk vẫn resumable; chạy lại sẽ resume đúng điểm."
              exit 1
            fi
            DONE=$(printf '%s\n' "$OUT" | sed -n 's/^DRAIN_RESULT done=//p' | cut -d' ' -f1)
            # Commit chunk nếu có thay đổi (một commit cho state + site đã sinh).
            git config user.name "total-factory-bot"
            git config user.email "nguyentuantu2482@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "factory: publish chunk (drain vòng $i) [automated txn]"
              ok=0
              for t in 1 2 3; do
                if git pull --rebase origin main && git push; then ok=1; break; fi
                echo "push vướng (lần $t) — rebase an toàn rồi thử lại"
                sleep 5
              done
              if [ "$ok" != "1" ]; then
                echo "push thất bại sau 3 lần — repo vẫn là checkpoint, vòng drain kế tiếp sẽ resume đúng điểm"
                exit 1
              fi
            fi
            if [ "$DONE" = "true" ]; then
              echo "backlog claimable đã drain hết sau $i vòng."
              exit 0
            fi
            if [ "$i" -ge "$MAX" ]; then
              echo "FAIL: vượt giới hạn vòng an toàn ($MAX) mà backlog chưa drain hết — NO_PROGRESS guard / rà soát thủ công."
              exit 1
            fi
          done

      # Cleanup CHỈ giải phóng lock khi CHÍNH run này đã acquire thành công
      # (token file tồn tại). Acquire fail / run chưa từng giữ lock -> KHÔNG
      # đụng lock của writer khác.
      - name: Giải phóng writer lock (chỉ khi run này giữ lock)
        if: always() && steps.gate.outputs.proceed == 'true'
        env:
          TOKEN_FILE: ${{ runner.temp }}/writer-lock-token
        run: |
          if [ -f "$TOKEN_FILE" ]; then
            node factory/factory.js unlock --owner ci-publisher --token "$(cat "$TOKEN_FILE")"
            rm -f "$TOKEN_FILE"
          else
            echo "run này không giữ writer lock — KHÔNG đụng lock của writer khác."
          fi

      # CỔNG CUỐI — SUCCESS chỉ khi mọi điều kiện dưới đây xanh.
      - name: 'Cổng cuối: state sạch + backlog claimable = 0'
        if: steps.gate.outputs.proceed == 'true'
        run: |
          node factory/factory.js check-state
          node factory/factory.js backlog --fail-if-claimable --head-sha "$GITHUB_SHA"

      - name: 'Cổng cuối: không patch tay HTML (read-only, byte-exact)'
        if: steps.gate.outputs.proceed == 'true'
        run: node factory/generate.js --check

      - name: 'Cổng cuối: audit mọi bài PUBLISHED >= 75'
        if: steps.gate.outputs.proceed == 'true'
        run: node factory/factory.js audit --min-score 75

      - name: 'Cổng cuối: toàn bộ test nền tảng'
        if: steps.gate.outputs.proceed == 'true'
        run: node factory/test.js

      - name: 'Cổng cuối: bộ test hardening'
        if: steps.gate.outputs.proceed == 'true'
        run: node factory/test-hardening.js

      - name: 'Cổng cuối: bất biến production (PUBLISHED ↔ source ↔ trang ↔ sitemap)'
        if: steps.gate.outputs.proceed == 'true'
        run: node factory/factory.js verify-invariant
