name: Factory Coordinator (maintenance tick)

# COORDINATOR GIẢN LỢC — mô hình 3 VAI TRÒ (docs/PRODUCTION-ROLES.md):
#   WRITER 1 (writer duy nhất, Mistral run ngoài) viết từng pair 2 bài -> push
#   -> factory-publish.yml publish exact push scope.
#   Coordinator KHÔNG còn phân công 3 writer, KHÔNG chạy các lệnh
#   cycle-* (legacy recovery, chỉ chạy thủ công) — chỉ là maintenance
#   tick mỗi 10 phút:
#     recover-txn -> resume/check-state -> queue-refill (idempotent) ->
#     manifest-sync (JSONL source of truth) -> verify-invariant -> backlog +
#     production-status -> commit state CHỈ KHI có thay đổi thật.
#   Tick rỗng KHÔNG commit (chống commit/deploy chỉ vì timestamp).
#
# Publish hot path nằm ở factory-publish.yml (một publisher duy nhất,
# concurrency group `total-production` dùng chung — không bao giờ chạy đè).
# Watchdog phát hiện writer đứng: factory-liveness.yml (read-only, exit 1).
#
# KHÔNG recursion nguy hiểm:
#   - Push bằng GITHUB_TOKEN KHÔNG trigger workflow kế tiếp (GitHub mặc định).
#   - Coordinator KHÔNG bao giờ chạm factory/data/articles/ -> không kích
#     factory-publish.yml.
on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: write

concurrency:
  group: total-production
  cancel-in-progress: false

jobs:
  coordinator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "1. Recover transaction (run trước crash giữa publish)"
        run: node factory/factory.js recover-txn

      - name: "2. Resume view + state guard"
        run: |
          node factory/factory.js resume
          node factory/factory.js check-state

      - name: "3. Queue refill (idempotent: planned < 100 -> ~300, chỉ coordinator)"
        run: node factory/factory.js queue-refill --role coordinator

      - name: "4. Manifest sync (article-manifest.jsonl — JSONL source of truth)"
        run: node factory/factory.js manifest-sync --role coordinator

      - name: "5. Invariant + backlog + production status (read-only)"
        run: |
          node factory/factory.js verify-invariant
          node factory/factory.js backlog
          node factory/factory.js production-status

      - name: "6. Commit derived state (CHỈ khi có diff thật — tick rỗng không commit)"
        run: |
          git config user.name "total-factory-bot"
          git config user.email "nguyentuantu2482@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'COORD_NO_CHANGES: tick này không đổi state — không commit (chống churn timestamp).'
          else
            git commit -m "factory: coordinator maintenance tick [automated]"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then ok=1; break; fi
              echo "push/rebase thất bại (lần $i) — retry sau 5s"
              sleep 5
              git rebase --abort 2>/dev/null || true
            done
            if [ "$ok" != "1" ]; then echo "KHÔNG push được state sau 3 lần"; exit 1; fi
          fi
