name: Factory Coordinator (maintenance tick)

# Maintenance tick nhẹ — writer/publisher hot path nằm ở factory-publish.yml.
# Mỗi tick PHẢI refresh origin/main trước khi mutate để tránh scheduled event
# checkout SHA cũ rồi rebase conflict với publisher (bug stale snapshot cũ).
# Tick: fresh truth -> recover -> check -> refill -> manifest -> invariant/status
# -> commit CHỈ khi có diff thật.
on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: write

concurrency:
  group: total-production
  cancel-in-progress: false

jobs:
  coordinator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh repository truth (chống stale scheduled checkout)
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          echo "coordinator truth: $(git log -1 --format='%h %s')"

      - name: "1. Recover transaction (run trước crash giữa publish)"
        run: node factory/factory.js recover-txn

      - name: "2. Resume view + state guard"
        run: |
          node factory/factory.js resume
          node factory/factory.js check-state

      - name: "3. Queue refill (idempotent: planned < 100 -> ~300, chỉ coordinator)"
        run: node factory/factory.js queue-refill --role coordinator

      - name: "4. Manifest sync (article-manifest.jsonl — JSONL source of truth)"
        run: node factory/factory.js manifest-sync --role coordinator

      - name: "5. Invariant + backlog + production status (read-only)"
        run: |
          node factory/factory.js verify-invariant
          node factory/factory.js backlog
          node factory/factory.js production-status

      - name: "6. Commit derived state (CHỈ khi có diff thật — tick rỗng không commit)"
        run: |
          set -euo pipefail
          git config user.name "total-factory-bot"
          git config user.email "nguyentuantu2482@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'COORD_NO_CHANGES: tick này không đổi state — không commit (chống churn timestamp).'
          else
            git commit -m "factory: coordinator maintenance tick [automated]"
            ok=0
            for i in 1 2 3; do
              if git push; then
                ok=1
                break
              fi
              echo "push race lost; refresh + rebase (attempt $i/3)"
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort 2>/dev/null || true
                echo "rebase conflict — fail closed, không force push."
                break
              fi
            done
            if [ "$ok" != "1" ]; then
              echo "KHÔNG push được state sau 3 lần"
              exit 1
            fi
          fi
