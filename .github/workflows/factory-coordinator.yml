name: Factory Coordinator (light maintenance)

# Lightweight only: do not rescan/rebuild the whole 20k-site namespace.
# Full manifest/invariant/site audits live in factory-deep-audit.yml.
on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: write

concurrency:
  group: total-production
  cancel-in-progress: false

jobs:
  coordinator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fresh truth
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - name: Recover + state guard
        run: |
          set -euo pipefail
          node factory/factory.js recover-txn
          node factory/factory.js check-state

      - name: Queue refill only
        run: node factory/factory.js queue-refill --role coordinator

      - name: Production status
        run: node factory/factory.js production-status

      - name: Commit only real maintenance changes
        run: |
          set -euo pipefail
          git config user.name "total-factory-bot"
          git config user.email "nguyentuantu2482@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "COORD_NO_CHANGES"; exit 0; fi
          git commit -m "factory: coordinator light tick [automated]"
          ok=0
          for i in 1 2 3; do
            if git push; then ok=1; break; fi
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort 2>/dev/null || true; break; fi
          done
          if [ "$ok" != "1" ]; then exit 1; fi
