name: Factory Deep Audit

# HEAVY FULL GATE — KHÔNG nằm trong hot path pair. Chạy khi:
#   A. engine/workflow/recovery code vừa đổi (kèm CI ENGINE_CHANGE riêng);
#   B. manual workflow_dispatch;
#   C. kiểm tra định kỳ / trước final production audit.
# Mọi bước read-only hoặc chạy trên fixture tmp (test suite dùng bản sao
# repo trong /tmp) — KHÔNG mutate state thật, KHÔNG commit.
# Deep audit KHÔNG làm writer phải chờ sau mỗi pair.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-deep-audit
  cancel-in-progress: false

jobs:
  deep:
    name: Toàn bộ cổng nặng (read-only)
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 'Guard: state sạch (không lock/txn sót, checkpoint khớp)'
        run: node factory/factory.js check-state

      - name: Đọc trạng thái (READ STATE -> RECOVER/RESUME)
        run: |
          node factory/factory.js status
          node factory/factory.js resume

      - name: Kiểm tra không patch tay HTML (read-only, byte-exact)
        run: node factory/generate.js --check

      - name: Audit mọi bài PUBLISHED >= 75
        run: node factory/factory.js audit --min-score 75

      - name: Bất biến production (PUBLISHED ↔ source ↔ trang ↔ sitemap)
        run: node factory/factory.js verify-invariant

      - name: Bộ kiểm thử nền tảng
        run: node factory/test.js

      - name: Bộ kiểm thử hardening
        run: node factory/test-hardening.js

      - name: Bộ kiểm thử reliability 4 tầng (lock/drain/invariant/recovery)
        run: node factory/test-reliability.js

      - name: Bộ kiểm thử pair mode (PAIR_SIZE/exact scope/txn recovery)
        run: node factory/test-pair.js

      - name: Báo cáo backlog cuối (WAITING_FOR_WRITER không fail)
        run: node factory/factory.js backlog
