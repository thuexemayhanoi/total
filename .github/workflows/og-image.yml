name: Sinh og-cover.png
# Sinh ảnh đại diện Open Graph thuần Node (deterministic) — không cài phụ thuộc.
# Chỉ commit khi bytes thay đổi; commit ghép [skip ci] để không lặp workflow.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/img/og-cover.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  og:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sinh og-cover.png
        run: node scripts/make-og-image.mjs

      - name: Commit nếu thay đổi
        run: |
          if ! git diff --quiet -- assets/img/og-cover.png; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/img/og-cover.png
            git commit -m "Sinh og-cover.png cho Open Graph [skip ci]"
            git push
          else
            echo "og-cover.png không đổi — không commit."
          fi
