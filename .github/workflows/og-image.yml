name: Sinh og-cover.png

# Ảnh OG là deterministic và KHÔNG phụ thuộc nội dung bài.
# Chỉ chạy khi chính script/workflow OG đổi — không chạy theo mỗi writer push,
# heartbeat hay coordinator commit (giảm Actions/Pages churn không cần thiết).
on:
  push:
    branches: [main]
    paths:
      - 'scripts/make-og-image.mjs'
      - '.github/workflows/og-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  og:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sinh og-cover.png
        run: node scripts/make-og-image.mjs

      - name: Commit nếu thay đổi
        run: |
          git add assets/img/og-cover.png
          if ! git diff --cached --quiet -- assets/img/og-cover.png; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sinh og-cover.png cho Open Graph [skip ci]"
            git push
          else
            echo "og-cover.png không đổi — không commit."
          fi
