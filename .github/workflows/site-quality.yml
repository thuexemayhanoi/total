name: Site Quality

# Kiểm định site đã sinh: HTML phải khớp generator (chống sửa tay), liên kết
# nội bộ/canonical/sitemap sạch rác ký tự. Deterministic, không AI.
# SIMPLE PRODUCTION MODE:
#   - CONTENT_ONLY (chỉ article source + state): cây HTML trên main vẫn là
#     cây CŨ cho tới khi Factory Publish (pair) sinh lại — mọi gate cây sinh
#     chạy trên cây cũ sẽ ĐỎ GIẢ (kể cả repair push khi backlog = 0). Hoãn hết,
#     ghi log rõ; gate cây sinh thuộc về Factory Publish + Publish Verify.
#   - ENGINE_CHANGE: chạy gate đầy đủ, backlog-aware như cũ (claimable > 0 ->
#     hoãn; publisher chưa drain).
on:
  push:
    branches: [main]
    paths: ['**.html', 'factory/**', 'assets/**', 'sitemap.xml', 'sitemap-*.xml', 'robots.txt', '.github/workflows/site-quality.yml']
  pull_request:
    branches: [main]
    paths: ['**.html', 'factory/**', 'assets/**', 'sitemap.xml', 'sitemap-*.xml', 'robots.txt', '.github/workflows/site-quality.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Site sinh khớp generator + liên kết sạch
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Phân loại thay đổi (CONTENT_ONLY | ENGINE_CHANGE)
        id: mode
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          MODE=$(node factory/factory.js change-mode | sed -n 's/^CHANGE_MODE=//p')
          echo "CHANGE_MODE=$MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Đo backlog claimable (writer commit chờ publisher?)
        id: backlog
        run: |
          set -euo pipefail
          CLAIMABLE=$(node factory/factory.js backlog | grep -E '^CLAIMABLE_BACKLOG=' | cut -d= -f2)
          echo "CLAIMABLE_BACKLOG=${CLAIMABLE}"
          echo "claimable=${CLAIMABLE}" >> "$GITHUB_OUTPUT"

      # CONTENT_ONLY: HOÃN mọi gate cây sinh — cây cũ trên main chỉ được sinh
      # lại bởi Factory Publish (pair); gate ở đây sẽ đỏ giả.
      - name: Báo hoãn gate cây sinh (CONTENT_ONLY — chờ Factory Publish)
        if: steps.mode.outputs.mode == 'CONTENT_ONLY'
        run: echo "CONTENT_ONLY push — generated-tree checks deferred to Factory Publish (pair) / Publish Verify (không đỏ giả trên cây cũ)."

      - name: Báo hoãn gate cây sinh (ENGINE_CHANGE + backlog > 0)
        if: steps.mode.outputs.mode != 'CONTENT_ONLY' && steps.backlog.outputs.claimable != '0'
        run: echo "Site Quality generated-tree checks deferred to Factory Publish / Factory Publish Verify because claimable backlog > 0."

      - name: HTML trên đĩa phải khớp kết quả sinh (không patch tay)
        if: steps.mode.outputs.mode != 'CONTENT_ONLY' && steps.backlog.outputs.claimable == '0'
        run: node factory/generate.js --check

      - name: Kiểm định trang sinh (liên kết, canonical, sitemap, ký tự rác)
        if: steps.mode.outputs.mode != 'CONTENT_ONLY' && steps.backlog.outputs.claimable == '0'
        run: node factory/test.js
