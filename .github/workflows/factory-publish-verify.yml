name: Factory Publish Verify (read-only)

# Verify SAU publish — read-only, không commit. Luồng: READ STATE
# -> RECOVER/RESUME -> VERIFY. Kiểm tra bất biến publish:
#   - mọi slot PUBLISHED có bài + trang sinh + nằm trong sitemap-articles;
#   - mọi URL bài trong sitemap-articles thuộc slot PUBLISHED;
#   - checkpoint khớp ma trận, không writer lock bị bỏ lại.
#
# THAY ĐỔI HARDENING:
#   - Tự chạy SAU mỗi lần "Factory Publish (chunked)" thành công
#     (workflow_run) — trước đây chỉ chạy manual, verify bị bỏ lọt khi cần nhất.
#   - Checkout đúng HEAD main SAU bot commit (head_branch của run publish).
#   - XÓA bước `generate` đột biến: chỉ chạy `--check` read-only — không ghi
#     đĩa, không xoá bằng chứng stale.
#   - Script bất biến FAIL LOUD khi module bài lỗi (in tên file + exit 1).
#
# THAY ĐỔI HARDENING 4-TẦNG (docs/FACTORY-RELIABILITY.md):
#   - Bất biến production chuyển sang `factory.js verify-invariant` (logic
#     canonical trong factory/lib/factory-runtime.js — KHÔNG heredoc duplicate).
#   - DEFECT B: publish SUCCESS + backlog article-backed claimable > 0 -> FAIL
#     (trước đây chỉ in "CẢNH BÁO" — workflow xanh trong khi factory đứng).
#     PLANNED chưa có module bài (WAITING_FOR_WRITER) KHÔNG fail CI.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Factory Publish (chunked)']
    types: [completed]
  push:
    branches: [main]
    paths: ['.github/workflows/factory-publish-verify.yml']

permissions:
  contents: read

concurrency:
  group: factory-publish-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    # workflow_run: chỉ verify khi publish chạy xong thành công.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn (HEAD main SAU bot commit của publish)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Đọc trạng thái (READ STATE -> RECOVER/RESUME)
        run: |
          node factory/factory.js status
          node factory/factory.js resume

      - name: Audit mọi bài PUBLISHED >= 90
        run: node factory/factory.js audit --min-score 90

      - name: Kiểm tra không patch tay HTML (read-only, byte-exact)
        run: node factory/generate.js --check

      - name: Bộ kiểm thử nền tảng
        run: node factory/test.js

      - name: Bộ kiểm thử hardening
        run: node factory/test-hardening.js

      - name: Bất biến publish + backlog drain hết (FAIL nếu còn claimable)
        run: |
          node factory/factory.js verify-invariant
          # DEFECT B hardening: publish workflow SUCCESS mà còn backlog
          # article-backed claimable -> verify PHẢI FAIL (không chỉ cảnh báo),
          # kèm chẩn đoán: pending ID, state, article source, HEAD SHA.
          # PLANNED chưa có module bài (WAITING_FOR_WRITER) KHÔNG fail CI.
          node factory/factory.js backlog --fail-if-claimable --head-sha "${{ github.sha }}"
