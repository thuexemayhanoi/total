name: Factory Publish Verify (read-only)

# Verify SAU publish — read-only, không commit. LIGHT VERIFY: chỉ những gì
# cần để khẳng định pair đã drain sạch và cây sinh khớp. Heavy suite
# (audit/hardening/reliability) thuộc về Factory Publish mốc 100 bài và
# factory-deep-audit.yml — KHÔNG chạy mỗi pair.
# Kiểm tra bất biến publish:
#   - mọi slot PUBLISHED có bài + trang sinh + nằm trong sitemap-articles;
#   - mọi URL bài trong sitemap-articles thuộc slot PUBLISHED;
#   - checkpoint khớp ma trận, không writer lock / txn marker bị bỏ lại;
#   - backlog article-backed claimable = 0 (FAIL nếu còn — regression drain).

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Factory Publish (pair)']
    types: [completed]
  push:
    branches: [main]
    paths: ['.github/workflows/factory-publish-verify.yml']

permissions:
  contents: read

concurrency:
  group: factory-publish-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    # workflow_run: chỉ verify khi publish chạy xong thành công.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn (HEAD main SAU bot commit của publish)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Đọc trạng thái (READ STATE -> RECOVER/RESUME)
        run: |
          node factory/factory.js status
          node factory/factory.js resume

      - name: 'Guard: state sạch (không lock/txn sót, checkpoint khớp)'
        run: node factory/factory.js check-state

      - name: Kiểm tra không patch tay HTML (read-only, byte-exact)
        run: node factory/generate.js --check

      - name: Bất biến publish + backlog drain hết (FAIL nếu còn claimable)
        run: |
          node factory/factory.js verify-invariant
          # publish SUCCESS mà còn backlog article-backed claimable -> FAIL
          # (kèm chẩn đoán: pending ID, state, article source, HEAD SHA).
          # PLANNED chưa có module bài (WAITING_FOR_WRITER) KHÔNG fail CI.
          node factory/factory.js backlog --fail-if-claimable --head-sha "${{ github.sha }}"
