                h2: 'Thay nhớt đúng lịch: việc quan trọng nhất của pha máy',
                html: '<p>Nếu phải chọn một việc duy nhất để làm đúng trong pha máy, đó là thay dầu nhớt đúng lịch. Trong giai đoạn chạy rà, các bề mặt kim loại mài vào nhau và thải ra một lượng mạt kim loại cực nhỏ lẫn trong nhớt. Mạt ấy ở mức nhỏ không nhìn thấy được, nhưng nó tồn tại thật, và nhớt pha máy đúng loại được thiết kế để gánh chịu giai đoạn này. Để nhớt quá hạn nghĩa là để mạt kim loại được kéo đi khắp động cơ, làm vai trò của những hạt mài mòn cực nhỏ giữa các bề mặt đang cần ôm khít.</p><p>Lịch thay nhớt của giai đoạn pha máy dày hơn lịch bảo dưỡng thường: kỳ đầu thường ngắn, sau đó dần dãn ra, và mức cụ thể theo khuyến cáo kèm xe — mỗi hãng một lịch riêng, nên việc của bạn là đọc đúng lịch của chiếc xe mình chứ đừng nghe lại kinh nghiệm đời người khác với mẫu xe khác. Khi thay nhớt ở đại lý, nhớ yêu cầu kiểm tra cả dầu hộp số và dầu phanh nếu xe dùng loại cần thay riêng, vì đây cũng là dịp duy nhất trong tháng đầu mà xe được soi toàn diện.</p><p>Một thói quen đáng có trong giai đoạn này: liếc số km mỗi tối và đối chiếu với lịch thay nhớt — bấm sẵn vào lịch điện thoại hai mốc quan trọng nhất của pha máy, để phòng ngày bận mà quên. Chi phí của một lần thay nhớt đúng hạn rất nhỏ so với chi phí sửa một động cơ bị mài mòn lệch; đây là khoản đầu tư lãi nhất trong toàn bộ giai đoạn pha máy.</p>',
              },
              {
                h2: 'Những thói quen hủy hoại pha máy',
                html: '<p>Danh sách các việc cần tránh trong ngàn km đầu không dài, nhưng mỗi mục đều là thói quen phổ biến của người mới. Một, chạy lại ga: vặn ga lên rồi giữ ở vòng tua cao kéo dài trong lúc xe đứng yên — thói quen nghe rất oai nhưng ép piston non trẻ làm việc ở vòng tua cao khi không có gió làm mát. Hai, rồ ga hết cỡ ngay từ đèn xanh: xuất phát bốc làm dây côn, dây xích và hộp số non trẻ nhận tải đột ngột. Ba, phanh gấp rồi ép số thấp để lấy tiếng máy gằn to: tạo xung lực dập lên hệ thống truyền động còn đang chạy rà.</p><p>Bốn, chở nặng hoặc đi hai người ngay những chuyến đầu, kể cả bạn bè muốn thử xe mới. Năm, đi chuyến dài liên tục nhiều tiếng đồng hồ, cho động cơ làm việc liên tục không nghỉ trước khi các bề mặt khít nhau. Sáu, tự ý đổ thêm nhớt ngoài lịch hoặc thay loại nhớt không đúng khuyến cáo — nghĩ là tốt hơn lại thành phá vỡ kế hoạch chạy rà mà nhà sản xuất đã tính toán.</p><p>Bảy, và cũng là cái ít người ngờ nhất: để xe phơi nắng mưa suốt tháng đầu. Giai đoạn này bạn đang chăm xe nhiều nhất, và việc để xe ở nơi thoáng, có mái che, lau khô sau mưa cũng là một phần của pha máy — chiếc xe sạch và khô cho mọi chi tiết, kể cả xích và các mối nối, một khởi đầu tốt. Không mục nào trong danh sách này đòi hỏi kỹ năng; tất cả chỉ đòi hỏi kỷ luật trong một tháng.</p>',
