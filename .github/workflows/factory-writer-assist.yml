              {
                h2: 'Nghe ngóng dấu hiệu bất thường trong tháng đầu',
                html: '<p>Pha máy cũng là lúc bạn và chiếc xe làm quen nhau, nên hãy dành chút chú ý cho tiếng động cơ mỗi buổi sáng. Động cơ mới chạy đúng chuẩn có một chất âm đều và mượt theo tốc độ; điều cần bắt là những âm đi lệch khỏi chất âm ấy — tiếng lục cục nhẹ từ hộp số khi vào số, tiếng rít từ vùng xích, tiếng kêu lạ từ phía côn mỗi lần tháo côn. Nhiều tiếng trong giai đoạn đầu là do các chi tiết chưa khít và sẽ tự biến mất sau khi xe chạy rà thêm — nhưng bạn không thể tự chắc được tiếng nào lành tiếng nào dữ, và đó chính là lý do mọi tiếng lạ đều đáng để hỏi thợ trong lần thay nhớt đầu tiên.</p><p>Đừng xem việc mang xe về đại lý lúc xe còn mới là phiền phức: trong thời hạn bảo hành, mọi kiểm tra đều nên được ghi lại một cách rõ ràng — một chiếc xe được chăm sóc đúng lịch và có dấu vết chăm sóc là một chiếc xe giữ được giá trị lẫn sự tin tưởng của thợ sau này. Ngược lại, một tiếng kêu nhỏ bị bỏ qua trong tháng đầu đôi khi là dấu hiệu sớm của một chi tiết lắp chưa khít — cái loại vấn đề sửa trong một buổi khi còn nhỏ, và thành cả một đại tu khi để muộn.</p><p>Ngoài âm thanh, để ý thêm ba dấu hiệu trực quan: vết dầu nhớt dưới chỗ đỗ xe mỗi sáng, độ căng của xích sau những ngày mưa, và màu khói xả khi đề máy lạnh. Xe mới gần như không để lại vết dầu, xích mới không duỗi nhanh, và khói xả gần như không thấy — bất kỳ điều gì khác biệt đều đáng mang xe đi sớm một buổi.</p>',
