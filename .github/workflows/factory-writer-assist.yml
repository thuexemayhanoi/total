              {
                h2: 'Pha máy là gì và vì sao ngàn km đầu quyết định tuổi thọ xe',
                html: '<p>Pha máy là giai đoạn chạy rà đầu tiên của một chiếc xe mới: các chi tiết kim loại bên trong động cơ và hộp số tuy được gia công chính xác đến mức mắt thường không thấy khuyết điểm, nhưng dưới kính lúp vẫn còn những vi nhấp nhô rất nhỏ. Trong ngàn km đầu tiên, những bề mặt tiếp xúc này mài mòn dần vào nhau, hai bề mặt ngày càng ôm khít, và kết quả của quá trình ấy là một động cơ chạy mượt, kín và bền — hoặc nếu chạy sai cách, là một động cơ mài mòn lệch và ồn ào suốt đời.</p><p>Nghĩa của điều này với người mua xe mới: chiếc xe bạn đang cầm ga đang ở thời điểm dễ tổn thương nhất và cũng dễ nuôi tốt nhất. Mọi thói quen tốt được gieo trong một tháng đầu sẽ được động cơ trả lại bằng nhiều năm chạy êm; mọi thói quen xấu — vặn ga hết cỡ, chạy lại ga, để quá hạn nhớt — cũng được ghi nhận y như vậy, chỉ là theo chiều ngược lại. Vì vậy hiểu pha máy không phải hiểu một thủ tục kỹ thuật khô khan, mà là nắm đúng một tháng vàng để chăm chiếc xe.</p><p>Cần nói rõ để khỏi lo lắng quá mức: xe máy hiện đại được sản xuất với độ chính xác cao, pha máy sai một vài lần không lập tức làm hỏng động cơ. Chuẩn mực ở đây là kỷ luật trong đa số thời gian — giữ nguyên tắc trong phần lớn quãng đường, không cần run rẩy trước từng cú vặn ga. Một buổi chạy nhanh hơn bình thường trong ngàn km đầu không kết liễu chiếc xe của bạn; điều làm hỏng là thói quen lặp lại ngày này qua ngày khác.</p>',
