              {
                h2: 'Giai đoạn đầu: nhẹ ga, đa dạng tốc độ, tránh chở nặng',
                html: '<p>Giai đoạn đầu tiên của ngàn km đầu là lúc các bề mặt ma sát mới bắt đầu làm quen nhau, nên nguyên tắc lớn nhất là giữ mọi thứ nhẹ nhàng. Vặn ga vừa đủ, tăng tốc từ tốn, không rồ ga cho xe bốc rồi phanh gấp — mỗi cú tăng giảm tốc dữ dội tạo tải đột ngột lên những bề mặt đang còn non. Vòng tua lý tưởng theo giai đoạn này thường được nhà sản xuất ghi trong sách hướng dẫn kèm theo xe; nếu không nhớ con số, hãy mốc theo cảm giác: ga nhẹ nhàng đủ xe lăn bánh mau, không đưa ga vào vùng gằn cuối cùng của hành trình ga.</p><p>Nguyên tắc thứ hai dễ bị bỏ qua: đa dạng tốc độ. Nhiều người mới đi một cung đường cố định mỗi ngày và giữ đúng một tốc độ quen — cách chạy đều đấy nghe có vẻ hiền nhưng lại khiến các bề mặt chỉ được chạy rà ở đúng một điều kiện. Hãy chủ động đổi nhịp: chặng này chậm hơn, chặng sau nhanh hơn chút xíu, thỉnh thoảng xuống số rồi lên số lại. Hộp số là nơi có nhiều cặp bánh răng nhất cần ăn khớp, và nó chỉ được chạy rà đầy đủ khi bạn dùng đủ các cấp số trong nhiều tình huống khác nhau.</p><p>Thứ ba là tải trọng: tránh chở nặng, chở thêm người ngồi sau, hoặc đi những chuyến đường dài liên tục nhiều tiếng trong giai đoạn đầu. Tải nặng ép các bề mặt non trẻ làm việc quá mức trước khi chúng kịp ôm khít. Nếu buộc phải chở người hay đồ, hãy đi chậm hơn, nghỉ giữa chặng, và giảm bớt quãng đường. Sau khi xe đã qua phần đầu của ngàn km đầu, tăng tải dần dần — sức chịu của xe lớn hơn bạn nghĩ, nó chỉ cần được tăng theo nấc chứ không nhảy cóc từ đầu.</p>',
