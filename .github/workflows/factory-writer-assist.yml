name: Factory Writer Assist (diag-state)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/factory-writer-assist.yml']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: factory-writer-assist
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Cai Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dump state
        run: |
          set +e
          {
            echo '=== head ==='
            git log --oneline -3
            echo '=== check-state ==='
            node factory/factory.js check-state
            echo "CHECK_STATE_EXIT=$?"
            echo '=== backlog ==='
            node factory/factory.js backlog
            echo "BACKLOG_EXIT=$?"
            echo '=== checkpoint ==='
            cat factory/state/checkpoint.json
            echo '=== factory-state ==='
            cat factory/state/factory-state.json
            echo '=== matrix id counts ==='
            grep -oE 'S001[0-9]{2}' factory/state/matrix.json | sort | uniq -c
            echo '=== matrix tail ==='
            tail -c 3000 factory/state/matrix.json
            echo '=== verify-invariant ==='
            node factory/factory.js verify-invariant
            echo "INVARIANT_EXIT=$?"
          } > diag.txt 2>&1
          cat diag.txt
      - name: Push diag branch
        run: |
          git config user.name "factory-diag"
          git config user.email "nguyentuantu2482@users.noreply.github.com"
          git checkout -b diag-state
          git add diag.txt
          git commit -m "diag: dump state for publisher failure"
          git push -f origin diag-state
