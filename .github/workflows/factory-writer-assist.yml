                h2: 'Trời lạnh thay đổi điều kiện lái theo cách ít người để ý',
                html: '<p>Nhiệt độ thấp tác động đến con người trước cả khi bạn thấy lạnh rõ rệt. Bàn tay là bộ phận đầu tiên chịu đựng: chỉ sau vài phút ôm ga chạy trong gió, các ngón tay bắt đầu cứng lại, độ nhạy khi bóp cùm phanh và cảm giác về vị trí tay ga đều giảm dần. Người có kinh nghiệm vẫn lái được, nhưng mọi thao tác đều chậm hơn so với mùa nóng vài giây, và trên đường thì vài giây là khoảng cách giữa một lần phanh kịp và một lần phanh muộn.</p><p>Chiếc xe cũng bị ảnh hưởng âm thầm. Ắc quy cho dòng điện khởi động kém đi rõ rệt khi nhiệt độ tụt, vì phản ứng hóa học bên trong pin diễn ra chậm khi lạnh. Nhớt máy đặc hơn lúc mới nổ, nên những giây đầu tiên sau khi khởi động là lúc các chi tiết kim loại bên trong động cơ chạy với lớp dầu bôi trơn mỏng hơn bình thường. Áp suất lốp cũng tụt theo nhiệt độ, làm bánh xe mềm hơn và mòn không đều nếu không được bơm cho đủ chuẩn.</p><p>Hệ quả của cả hai phía cộng lại: khoảng cách an toàn theo thói quen mùa nóng thường không đủ cho mùa lạnh. Một chuyến đi an toàn khi trời lạnh bắt đầu từ việc thừa nhận điều kiện đã thay đổi, rồi chủ động điều chỉnh từ trang phục, cách khởi động cho đến nhịp phanh ga trên đường.</p>',
