name: Article Batch (read-only dry-run)

# Chạy thử KHÔNG GHI: xem trạng thái xưởng, kế hoạch chunk, QA thử bài đang chờ.
# Không đổi state, không sinh site, không commit — tương đương article-batch
# của /vanchinh, adapt sang Node factory của /total.
#
# THAY ĐỔI HARDENING: module bài lỗi -> FAIL LOUD (in tên file + exit 1),
# không âm thầm bỏ qua khiến QA "không có bài" giả.
# THAY ĐỔI HARDENING 4-TẦNG: kế hoạch chunk + QA thử chuyển sang CLI canonical
# `factory.js plan-chunk` / `factory.js qa-preview` (logic trong
# factory/lib/factory-runtime.js) — KHÔNG còn heredoc duplicate giữa workflow.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Số slot tối đa của chunk thử (mặc định 5)'
        required: false
        default: '5'
  push:
    branches: [main]
    paths: ['.github/workflows/article-batch.yml']

permissions:
  contents: read

concurrency:
  group: article-batch
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Trạng thái xưởng (READ STATE)
        run: |
          node factory/factory.js status
          node factory/factory.js resume

      - name: Kế hoạch chunk (read-only — logic canonical qua factory.js)
        id: plan
        run: |
          OUT=$(node factory/factory.js plan-chunk --limit "${{ inputs.limit || github.event.inputs.limit }}")
          echo "$OUT"
          IDS=$(printf '%s\n' "$OUT" | sed -n 's/^PLAN ids=//p')
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"

      - name: QA thử từng slot trong chunk (read-only, KHÔNG ghi state)
        run: |
          IDS="${{ steps.plan.outputs.ids }}"
          if [ -z "$IDS" ]; then
            echo "không có slot claimable nào có module bài — không có gì để QA thử."
          else
            for ITEM in $IDS; do
              ID="${ITEM%%:*}"
              node factory/factory.js qa-preview "$ID"
            done
          fi
          echo "chunk dry-run xong — KHÔNG ghi state."

      - name: 'Khẳng định: không lock, không state bẩn'
        run: |
          test ! -f factory/state/writer.lock || { echo "writer lock bị commit lại — state bẩn, cần rà"; exit 1; }
          node -e "const m=require(process.cwd()+'/factory/state/matrix.json');const c=require(process.cwd()+'/factory/state/checkpoint.json');if(c.slotCount!==m.slots.length){console.error('checkpoint lệch ma trận');process.exit(1)}console.log('checkpoint khớp ma trận:',c.slotCount,'slot')"
