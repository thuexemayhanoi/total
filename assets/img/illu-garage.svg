<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="Ảnh minh họa: đĩa phanh, kẹp phanh và cờ lê bảo dưỡng">
  <!-- AI WIKI TOTAL — minh họa editorial: garage / hệ thống phanh -->
  <rect width="960" height="640" fill="#F4F1E8"/>
  <!-- đĩa phanh -->
  <circle cx="430" cy="320" r="230" fill="#FFFFFF" stroke="#172033" stroke-width="8"/>
  <circle cx="430" cy="320" r="150" fill="none" stroke="#172033" stroke-width="5" stroke-dasharray="6 22"/>
  <circle cx="430" cy="320" r="80" fill="#F4F1E8" stroke="#172033" stroke-width="6"/>
  <circle cx="430" cy="320" r="22" fill="#3157D5"/>
  <circle cx="430" cy="180" r="18" fill="#F4F1E8" stroke="#172033" stroke-width="5"/>
  <circle cx="570" cy="370" r="18" fill="#F4F1E8" stroke="#172033" stroke-width="5"/>
  <circle cx="290" cy="370" r="18" fill="#F4F1E8" stroke="#172033" stroke-width="5"/>
  <circle cx="430" cy="460" r="18" fill="#F4F1E8" stroke="#172033" stroke-width="5"/>
  <!-- má phanh / vệt ma sát -->
  <path d="M430 320 L 430 90" stroke="#F59E0B" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
  <!-- kẹp phanh -->
  <rect x="380" y="60" width="100" height="56" rx="18" fill="#3157D5"/>
  <rect x="408" y="116" width="44" height="40" rx="10" fill="#26449F"/>
  <!-- cờ lê -->
  <g transform="rotate(-24 760 470)">
    <rect x="726" y="416" width="30" height="150" rx="12" fill="#172033"/>
    <path d="M726 436 l -52 -34 l 14 -22 l 26 16 l -6 -30 l 26 0 l -6 30 l 26 -16 l 14 22 Z" fill="#3157D5"/>
  </g>
  <!-- tia cảnh báo -->
  <path d="M150 120 L 122 190 L 160 190 L 134 252 L 196 168 L 160 168 L 184 120 Z" fill="#F59E0B"/>
  <circle cx="120" cy="540" r="10" fill="#3157D5" opacity="0.4"/>
  <circle cx="850" cy="180" r="12" fill="#F59E0B" opacity="0.6"/>
  <circle cx="880" cy="560" r="8" fill="#3157D5" opacity="0.4"/>
</svg>
