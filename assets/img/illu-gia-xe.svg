<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="Ảnh minh họa: thẻ giá, xu tiền và biểu đồ cột so sánh giá xe">
  <!-- AI WIKI TOTAL — minh họa editorial: giá xe / thị trường -->
  <rect width="960" height="640" fill="#F4F1E8"/>
  <rect y="470" width="960" height="170" fill="#FFFFFF"/>
  <line x1="0" y1="470" x2="960" y2="470" stroke="#172033" stroke-width="3"/>
  <!-- biểu đồ cột -->
  <rect x="120" y="330" width="70" height="140" rx="10" fill="#3157D5" opacity="0.45"/>
  <rect x="230" y="260" width="70" height="210" rx="10" fill="#3157D5"/>
  <rect x="340" y="380" width="70" height="90" rx="10" fill="#3157D5" opacity="0.45"/>
  <rect x="450" y="210" width="70" height="260" rx="10" fill="#F59E0B"/>
  <line x1="100" y1="470" x2="560" y2="470" stroke="#172033" stroke-width="5" stroke-linecap="round"/>
  <!-- thẻ giá -->
  <g transform="rotate(8 760 220)">
    <rect x="600" y="130" width="320" height="180" rx="20" fill="#FFFFFF" stroke="#172033" stroke-width="6"/>
    <circle cx="668" cy="130" r="22" fill="#F4F1E8" stroke="#172033" stroke-width="6"/>
    <line x1="706" y1="180" x2="860" y2="180" stroke="#3157D5" stroke-width="12" stroke-linecap="round"/>
    <line x1="706" y1="216" x2="824" y2="216" stroke="#172033" stroke-width="8" opacity="0.35"/>
    <line x1="706" y1="246" x2="790" y2="246" stroke="#172033" stroke-width="8" opacity="0.35"/>
    <rect x="600" y="150" width="52" height="24" rx="10" fill="#F59E0B"/>
  </g>
  <!-- xu tiền -->
  <circle cx="180" cy="580" r="26" fill="#F59E0B"/>
  <circle cx="180" cy="580" r="16" fill="none" stroke="#172033" stroke-width="4" opacity="0.5"/>
  <circle cx="238" cy="596" r="20" fill="#3157D5"/>
  <circle cx="620" cy="580" r="16" fill="#3157D5" opacity="0.6"/>
  <circle cx="900" cy="480" r="10" fill="#3157D5" opacity="0.4"/>
</svg>
